<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Lens</title><style>body{margin:0;background:#f5f7fa;color:#172033;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}header{background:#111827;color:#fff;padding:24px 6vw}main{max-width:1100px;margin:25px auto;padding:0 18px}.search{display:flex;gap:8px}.search input{flex:1;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px}.search button{padding:0 22px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:700}.card{background:white;border:1px solid #e5e9f0;border-radius:14px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.wide{grid-column:1/-1}.muted{color:#718096}.price{font-size:32px;font-weight:800}.tabs button{padding:7px 12px;margin-right:5px;border:1px solid #ddd;border-radius:8px;background:white}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{border:1px solid #eee;border-radius:9px;padding:12px}.metric b{display:block;font-size:19px;margin-top:4px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee;text-align:right}td:first-child,th:first-child{text-align:left}@media(max-width:750px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><header><h1>Stock Lens</h1><div class="muted">日本株を検索・比較・分析するための無料試作版</div></header><main><div class="search"><input id="q" placeholder="会社名・会社名の一部・4桁コード（例：RIZAP / 2928）"><button onclick="go()">検索</button></div><div class="card"><div><b id="name">RIZAPグループ</b> <span class="muted" id="code">2928</span></div><div class="price">168円</div><div class="muted">株価データ接続前の試作画面</div></div><div class="grid"><div class="card"><h3>株価チャート</h3><div class="tabs"><button>日足</button><button>週足</button><button>月足</button></div><canvas id="c" width="850" height="320" style="width:100%"></canvas><p class="muted">今後、実データ・出来高・移動平均線を追加します。</p></div><div class="card"><h3>主要指標</h3><div class="metrics"><div class="metric"><small>PER</small><b>32.4倍</b></div><div class="metric"><small>PBR</small><b>1.82倍</b></div><div class="metric"><small>ROE</small><b>5.6%</b></div><div class="metric"><small>割安スコア</small><b>68 / 100</b></div></div></div><div class="card wide"><h3>決算</h3><table><tr><th>項目</th><th>今期</th><th>前年同期</th><th>前年比</th></tr><tr><td>売上高</td><td>—</td><td>—</td><td>—</td></tr><tr><td>営業利益</td><td>—</td><td>—</td><td>—</td></tr><tr><td>純利益</td><td>—</td><td>—</td><td>—</td></tr></table></div><div class="card"><h3>同業比較</h3><p>実データ接続後に同業他社とPER・PBR・ROE・成長率などを比較します。</p></div><div class="card"><h3>IR・ニュース</h3><p>TDnet等から銘柄別に表示する予定です。</p></div></div></main><script>function go(){let q=document.getElementById('q').value.trim();let m={'2928':'RIZAPグループ','8267':'イオン','7203':'トヨタ自動車','8035':'東京エレクトロン','6758':'ソニーグループ','9432':'NTT'};for(let k in m){if(q===k||m[k].includes(q)||q.includes(m[k])){document.getElementById('name').textContent=m[k];document.getElementById('code').textContent=k;}}}let c=document.getElementById('c'),x=c.getContext('2d');x.strokeStyle='#2563eb';x.lineWidth=3;x.beginPath();for(let i=0;i<80;i++){let y=190-Math.sin(i/5)*35-i*.35+(Math.random()-.5)*25;x.lineTo(i*10+15,y)}x.stroke();</script></body></html>
